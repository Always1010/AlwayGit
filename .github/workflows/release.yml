name: Release VSIX

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release tag and project version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the stable version format vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          VERSION="$version" node <<'NODE'
          const fs = require('node:fs');

          const expected = process.env.VERSION;
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = [
            ['package.json', manifest.version],
            ['package-lock.json', lock.version],
            ['package-lock.json packages[""]', lock.packages?.['']?.version],
          ];

          for (const [source, actual] of versions) {
            if (actual !== expected) {
              console.error(`${source} version ${actual ?? '<missing>'} does not match tag version ${expected}.`);
              process.exit(1);
            }
          }
          NODE

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Tagged commit $tagged_commit is not contained in origin/main." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check types and translations
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/vitest-release.json

      - name: Summarize the same release test run
        id: test_summary
        continue-on-error: true
        run: |
          node scripts/repository-stats.mjs summarize-tests \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --report artifacts/vitest-release.json \
            --output artifacts/release-test-summary.json

      - name: Retain release test summary for statistics and deployment recovery
        if: steps.test_summary.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-test-summary-${{ github.ref_name }}
          path: artifacts/release-test-summary.json
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native dependencies on the target platform
        run: npm ci

      - name: Package and verify the extracted VSIX
        run: node scripts/package.mjs --target ${{ matrix.target }}

      - name: Generate package checksum
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const name = `alwaygit-${process.env.VERSION}-${process.env.TARGET}.vsix`;
          const hash = createHash('sha256').update(readFileSync(`artifacts/${name}`)).digest('hex');
          writeFileSync(`artifacts/${name}.sha256`, `${hash}  ${name}\n`);
          NODE

      - name: Upload verified platform package
        uses: actions/upload-artifact@v7
        with:
          name: alwaygit-release-${{ matrix.target }}
          path: |
            artifacts/alwaygit-${{ env.VERSION }}-${{ matrix.target }}.vsix
            artifacts/alwaygit-${{ env.VERSION }}-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download all verified platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: alwaygit-release-*
          merge-multiple: true
          path: release

      - name: Verify the complete set of release checksums
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = [];
          for (const target of ['win32-x64', 'linux-x64', 'linux-arm64']) {
            const name = `alwaygit-${process.env.VERSION}-${target}.vsix`;
            const hash = createHash('sha256').update(readFileSync(`release/${name}`)).digest('hex');
            if (readFileSync(`release/${name}.sha256`, 'utf8') !== `${hash}  ${name}\n`) {
              throw new Error(`Checksum mismatch: ${name}`);
            }
            expected.push(name, `${name}.sha256`);
          }
          if (JSON.stringify(readdirSync('release').sort()) !== JSON.stringify(expected.sort())) {
            throw new Error('Release assets are missing or unexpected.');
          }
          NODE

      - name: Ensure the release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.vsix release/*.vsix.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "AlwayGit $VERSION"

  statistics:
    name: Publish release repository statistics
    needs: publish
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/repository-stats.yml
    with:
      tag: ${{ github.ref_name }}
      release_run_id: ${{ github.run_id }}
